# Dependabot 配置（1013 由 NIS 提交，1013b 加 major 拦截）
# 策略：① 安全更新成组（别一包一 PR）② 常规升级只放行 minor/patch 并成组
#      ③ **大版本（major）一律不提 PR** —— 要人腾出时间测，不适合自动跟
# 说明：安全更新由仓库设置里的 Dependabot Security Updates 触发（已开启），不受 open-pull-requests-limit 限制。
version: 2
updates:
  # 后端（npm，backend/package-lock.json）
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 前端（pnpm 锁文件；Dependabot 用 npm 生态识别）
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 仓库根
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Tauri 壳（Rust）
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /setup/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
