name: Bug 报告
description: 用起来哪里不对劲？报给我们
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把下面填完整，能让定位快很多。
        安装 / 配置 / 模型接入这类问题，去 Discussions 提问更快。
  - type: input
    id: version
    attributes:
      label: NIS 版本
      description: 设置 → 关于 里能看到（例如 1.1.3）
      placeholder: "1.1.3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望的行为 vs 实际的行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点了 …
        3. 出现 …
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 报错信息 / 截图（可选）
      description: 日志在数据目录的 logs/ 下（开发态 backend/logs/，安装版 %APPDATA%\nis\data\logs\）；截图可直接拖进来
    validations:
      required: false
