[package]
name = "nis-ui"
version = "1.1.3"
description = "NIS Interface - Vue 3 + Tauri 2.0"
authors = ["NIS"]
edition = "2021"
# 0915：显式声明 bin，把产物从 nis-ui.exe 改成对外的 NIS.exe（autobins 关掉，避免和自动发现打架）
autobins = false

[[bin]]
name = "NIS"
path = "src/main.rs"

[lib]
name = "nis_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.6", features = [] }

[dependencies]
# tray-icon：0915 用户要求加系统托盘（关闭窗口收进托盘，托盘菜单可显示/退出）
tauri = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-store = "2.2.0"
tauri-plugin-notification = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
